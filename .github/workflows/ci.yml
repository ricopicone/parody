# CI for the parody toolchain itself. (Content repos get their own template
# via `parody init` in Phase 2.) Golden-parity tests need the private source
# corpora and auto-skip here; they run locally pre-release.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install pandoc-crossref (pinned in parody/toolchain.py)
        run: |
          curl -fsSL https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.18.1/pandoc-crossref-Linux-X64.tar.xz \
            | tar -xJ -C /usr/local/bin pandoc-crossref
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run parody check --toolchain
      - run: uv run pytest -q
