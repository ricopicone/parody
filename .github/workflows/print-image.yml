# Reproducible print image (Dockerfile.print — pinned full TeX Live).
#
# - build + smoke-test on demand, when the image inputs change, and weekly
#   (catches upstream drift); the image is ~5 GB so it stays off every push.
# - PUBLISH to GHCR on a GitHub Release, tagged <parody-version>-tl<year> (from
#   the release tag) plus the moving tl<year> tag. The image carries no licensed
#   fonts (those live in the book-private profile, mounted at runtime), so it is
#   safe to publish; make the package public once, in the repo's Packages
#   settings, so co-authors can pull without a login.
name: print-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.print
      - .dockerignore
      - .github/workflows/print-image.yml
      - tests/smoke-book/**
  release:
    types: [published]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/parody-print
  TL_TAG: tl2026 # bump when Dockerfile.print's TeX Live digest changes

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build print image (load for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.print
          tags: parody-print:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-build the sample book (memoir profile)
        run: |
          docker run --rm -v "$PWD":/book -w /book parody-print:ci \
            pdf tests/smoke-book --profile memoir -o /book/smoke.pdf
          test -s smoke.pdf || { echo "smoke.pdf missing or empty"; exit 1; }
          echo "smoke.pdf: $(du -h smoke.pdf | cut -f1)"

      # Publish the smoke-tested image only on a release, after it passes.
      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push <version>-tl<year> and tl<year> tags
        if: github.event_name == 'release'
        run: |
          V="${{ github.event.release.tag_name }}"; V="${V#v}"
          docker tag parody-print:ci "$IMAGE:$V-$TL_TAG"
          docker tag parody-print:ci "$IMAGE:$TL_TAG"
          docker push "$IMAGE:$V-$TL_TAG"
          docker push "$IMAGE:$TL_TAG"
          echo "published $IMAGE:$V-$TL_TAG and $IMAGE:$TL_TAG"
