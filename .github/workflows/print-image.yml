# Reproducible print image (Dockerfile.print — pinned full TeX Live).
#
# - build + smoke-test on demand, when the image inputs change, and weekly
#   (catches upstream drift); the image is ~5 GB so it stays off every push.
# - PUBLISH to GHCR is manual (workflow_dispatch with publish=true), matching
#   the manual PyPI release flow — run it after bumping the version / publishing
#   parody to PyPI. Tags the image <version>-tl<year> (version defaults to
#   pyproject.toml) plus the moving tl<year> tag. The image carries no licensed
#   fonts (those live in the book-private profile, mounted at runtime), so it is
#   safe to publish; make the package public once, in the repo's Packages
#   settings, so co-authors can pull without a login.
name: print-image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built image to GHCR"
        type: boolean
        default: false
      version:
        description: "Version for the image tag (blank = read pyproject.toml)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - Dockerfile.print
      - .dockerignore
      - .github/workflows/print-image.yml
      - tests/smoke-book/**
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/parody-print
  TL_TAG: tl2026 # bump when Dockerfile.print's TeX Live digest changes

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The full TeX Live image is ~10 GB unpacked; the default runner disk
      # (~14 GB free) overflows while loading it into Docker. Reclaim ~25 GB of
      # preinstalled toolchains first.
      - name: Free up runner disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true

      - uses: docker/setup-buildx-action@v3

      # No gha cache: the pinned 5 GB base layer would blow the 10 GB cache
      # limit and adds disk pressure; the base pulls from Docker Hub each run.
      - name: Build print image (load for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.print
          tags: parody-print:ci
          load: true

      - name: Smoke-build the sample book (memoir profile)
        run: |
          docker run --rm -v "$PWD":/book -w /book parody-print:ci \
            pdf tests/smoke-book --profile memoir -o /book/smoke.pdf
          test -s smoke.pdf || { echo "smoke.pdf missing or empty"; exit 1; }
          echo "smoke.pdf: $(du -h smoke.pdf | cut -f1)"

      # Publish the smoke-tested image only when explicitly requested.
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push <version>-tl<year> and tl<year> tags
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          V="${{ inputs.version }}"
          [ -z "$V" ] && V="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          docker tag parody-print:ci "$IMAGE:$V-$TL_TAG"
          docker tag parody-print:ci "$IMAGE:$TL_TAG"
          docker push "$IMAGE:$V-$TL_TAG"
          docker push "$IMAGE:$TL_TAG"
          echo "published $IMAGE:$V-$TL_TAG and $IMAGE:$TL_TAG"
