# Build on PR; artifact + checksums on tag. (Generated by `parody init`.)
name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "parody==$parody_version"
      - name: Build artifact (executes code cells)
        run: parody build . artifact/$slug.json
      - name: Validate artifact against schema
        run: parody check artifact/$slug.json
      - name: Build preview
        run: parody preview . -o preview --artifact artifact/$slug.json
      - name: Checksums
        run: cd artifact && sha256sum *.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: artifact
          path: artifact
      - name: Attach artifact + checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact/*.json
            artifact/SHA256SUMS

